<header class="topbar">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">{{ site.title }}</span>
  </a>
  <nav class="topnav" aria-label="Navigasi utama">
    {% for item in site.nav %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
  <div class="palette" id="palette">
    <button class="icon-btn" id="paletteBtn" type="button" aria-label="Pilih palet warna" aria-haspopup="true" aria-expanded="false" title="Palet warna">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>
    </button>
    <div class="pal-pop" id="palettePop" role="menu" hidden>
      <p class="pal-title">Palet warna</p>
      {% for p in site.data.palettes %}
      <button type="button" role="menuitemradio" aria-checked="false" class="pal-item" data-palette="{{ p.id }}"><i style="background: {{ p.sw }}"></i>{{ p.label }}</button>
      {% endfor %}
      <button type="button" role="menuitemradio" aria-checked="false" class="pal-item" data-palette="kustom"><i class="pal-custom-sw"></i>Kustom…</button>
      <div class="pal-custom" id="palCustom" hidden>
        <label>Warna utama <input type="color" id="palC1" value="#4fd1c5"></label>
        <label>Warna aksen <input type="color" id="palC2" value="#f6b73c"></label>
        <button type="button" class="pal-reset" id="palReset">Atur ulang</button>
      </div>
    </div>
  </div>
  <button class="icon-btn" id="themeToggle" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema">
    <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
